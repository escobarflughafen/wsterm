# One file for every instance. Instance-specific values come from .env:
#   COMPOSE_PROJECT_NAME  portfolio-terminal (prod) / portfolio-terminal-dev
#   PORT, BIND_ADDR       where the UI is published
#   DATA_PATH             host directory holding exports/, market/, build/ (bind mount, easy to back up)
#   APP_UID / APP_GID     host owner of DATA_PATH (the container runs as that user)
services:
  portfolio:
    build:
      context: .
      target: app        # the Dockerfile's last stage is `test`; the runtime image is `app`
    image: portfolio-terminal:${TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio-terminal}
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - ${DATA_PATH:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
