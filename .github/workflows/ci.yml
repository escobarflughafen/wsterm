name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-terminal:ci .
      - name: smoke test
        run: |
          docker run -d --name pt -e APP_PASSWORD=ci -p 8787:8787 portfolio-terminal:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u admin:ci http://127.0.0.1:8787/)" = 200
          docker rm -f pt
